<aside class="sidebar">
    <nav>
        <ul>
            <li *ngFor="let item of menuItems">

                <a
                    *ngIf="item.ruta"
                    [routerLink]="item.ruta">
                    {{ item.nombre }}
                </a>

                <button
                    *ngIf="item.accion === 'logout'"
                    type="button"
                    (click)="cerrarSesion()">
                    {{ item.nombre }}
                </button>

            </li>
        </ul>
    </nav>
</aside>

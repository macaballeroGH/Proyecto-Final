services:
  mysql:
    image: mysql:8.4
    container_name: beautymanager-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: beautymanager
      MYSQL_USER: beautymanager
      MYSQL_PASSWORD: beautymanager123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: